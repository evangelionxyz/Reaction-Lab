name: esp32
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5
  
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  flutter_blue_plus: ^2.3.14
  path_provider: ^2.1.6
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.3
  flutter_launcher_icons: ^0.14.2

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/ahm-logo.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/ahm-logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/ahm-logo.png